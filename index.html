<style>
:root {
  --bg: #081F12;
  --bg-panel: #0E2A18;
  --bg-card: #133520;
  --bg-card-hover: #1A4A2E;
  --accent: #E53E3E;
  --accent-dark: #C53030;
  --accent-glow: rgba(229,62,62,0.08);
  --accent-light: rgba(229,62,62,0.1);
  --accent-warm: #E53E3E;
  --crisis: #FBD38D;
  --crisis-bg: rgba(251,211,141,0.08);
  --success: #68D391;
  --info: #90CDF4;
  --info-bg: rgba(144,205,244,0.08);
  --tx: #F0F4F0;
  --tx2: #C8D5CC;
  --tx3: #8DA396;
  --bd: rgba(255,255,255,0.12);
  --bd-active: rgba(229,62,62,0.4);
  --r: 12px;
  --rs: 8px;
  --shadow: 0 4px 20px rgba(0,0,0,0.2);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.3);
  --ease: 0.25s cubic-bezier(0.4,0,0.2,1);
  --bar-w: 68px;
  --panel-w: 380px;
  --font-body: 'Times New Roman', Georgia, 'Palatino Linotype', serif;
  --font-display: 'Times New Roman', Georgia, 'Palatino Linotype', serif;
}

/* ═══ LIGHT THEME ═══ */
[data-theme="light"] {
  --bg: #F2EDE7;
  --bg-panel: #FEFCFA;
  --bg-card: #FFF8F2;
  --bg-card-hover: #FFF1E8;
  --accent: #C53030;
  --accent-dark: #9B2C2C;
  --accent-glow: rgba(197,48,48,0.07);
  --accent-light: rgba(197,48,48,0.08);
  --accent-warm: #C53030;
  --crisis: #DC2626;
  --crisis-bg: rgba(220,38,38,0.05);
  --success: #16A34A;
  --info: #2563EB;
  --info-bg: rgba(37,99,235,0.06);
  --tx: #1A2E1F;
  --tx2: #3D5744;
  --tx3: #7A9484;
  --bd: #D4CEC6;
  --bd-active: rgba(197,48,48,0.3);
  --shadow: 0 4px 20px rgba(0,0,0,0.04);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
}
[data-theme="light"] .icon-bar { background: #FAF7F3; box-shadow: 2px 0 16px rgba(0,0,0,0.04); }
[data-theme="light"] .panel { box-shadow: 4px 0 30px rgba(0,0,0,0.06); }
[data-theme="light"] .logo-mark { box-shadow: 0 4px 12px rgba(197,48,48,0.2); }
[data-theme="light"] .cta-open { box-shadow: 0 4px 14px rgba(197,48,48,0.25); }
[data-theme="light"] .cta-open:hover { box-shadow: 0 6px 20px rgba(197,48,48,0.3); }
[data-theme="light"] .toast { color: #fff; }
[data-theme="light"] body { background-image: radial-gradient(ellipse at 30% 10%,rgba(197,48,48,0.03) 0%,transparent 50%),radial-gradient(ellipse at 80% 90%,rgba(22,163,74,0.02) 0%,transparent 40%); }
[data-theme="light"] .icon-bar .sb-btn { color: #7A9484; }
[data-theme="light"] .icon-bar .sb-btn:hover { color: var(--accent); background: rgba(197,48,48,0.06); }
[data-theme="light"] .icon-bar .sb-btn.active { color: var(--accent); background: rgba(197,48,48,0.08); }
[data-theme="light"] .icon-bar .sb-btn.crisis-btn { color: #DC2626; }
[data-theme="light"] .icon-bar .sb-btn.crisis-btn:hover,
[data-theme="light"] .icon-bar .sb-btn.crisis-btn.active { color: #DC2626; background: rgba(220,38,38,0.06); }

/* ═══ THEME TOGGLE ═══ */
.theme-toggle{width:56px;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:10px;border:none;background:transparent;color:var(--tx3);cursor:pointer;font-size:1.1rem;transition:var(--ease);font-family:var(--font-body);position:relative;padding:4px 2px}
.theme-toggle:hover{background:rgba(229,62,62,0.08);color:var(--accent)}
.theme-toggle .sb-label{font-size:.6rem;letter-spacing:.01em;line-height:1}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--bg);background-image:radial-gradient(ellipse at 30% 10%,rgba(229,62,62,0.04) 0%,transparent 50%),radial-gradient(ellipse at 80% 90%,rgba(104,211,145,0.03) 0%,transparent 40%);color:var(--tx);line-height:1.65;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;min-height:100vh;text-rendering:optimizeLegibility}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

.skip-link{position:absolute;top:-100%;left:8px;background:var(--accent);color:#fff;padding:8px 16px;border-radius:var(--rs);z-index:9999;font-size:14px;text-decoration:none;font-weight:600}
.skip-link:focus{top:8px}

/* ═══ WIDGET CONTAINER ═══ */
.widget-wrap{position:fixed;top:0;left:0;height:100vh;display:flex;z-index:1000;pointer-events:none}
.widget-wrap>*{pointer-events:auto}

/* ═══ ICON SIDEBAR — KARA STYLE ═══ */
.icon-bar{width:var(--bar-w);height:100vh;background:#061A0E;border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;z-index:2;box-shadow:2px 0 16px rgba(0,0,0,0.25);flex-shrink:0}
.icon-bar::-webkit-scrollbar{display:none}

.sb-btn{width:56px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:transparent;border:none;border-radius:10px;cursor:pointer;color:var(--tx3);font-size:.6rem;letter-spacing:.01em;transition:var(--ease);padding:4px 2px;position:relative;font-family:var(--font-body);flex-shrink:0}
.sb-btn .sb-icon{font-size:1.25rem;line-height:1;transition:var(--ease)}
.sb-btn .sb-label{line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:54px}
.sb-btn:hover{background:rgba(229,62,62,0.08);color:var(--accent);transform:scale(1.03)}
.sb-btn:active{transform:scale(0.96)}
.sb-btn.active{color:#fff;background:rgba(229,62,62,0.14)}
.sb-btn.active::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;background:var(--accent);border-radius:0 3px 3px 0}
.sb-btn.crisis-btn{color:var(--crisis)}
.sb-btn.crisis-btn:hover,.sb-btn.crisis-btn.active{color:#fff;background:rgba(251,211,141,0.12)}
.sb-btn.crisis-btn.active::before{background:var(--crisis)}

.sb-div{width:36px;height:1px;background:rgba(255,255,255,0.08);margin:4px 0;flex-shrink:0}

.sidebar-footer{margin-top:auto;padding-top:6px;display:flex;flex-direction:column;align-items:center;gap:2px}

/* ═══ MAIN PANEL ═══ */
.panel{width:var(--panel-w);height:100vh;background:var(--bg-panel);border-right:1px solid var(--bd);overflow-y:auto;overflow-x:hidden;transform:translateX(-100%);transition:transform var(--ease);scrollbar-width:thin;scrollbar-color:var(--tx3) transparent;box-shadow:4px 0 30px rgba(0,0,0,0.3)}
.panel.open{transform:translateX(0)}
.panel::-webkit-scrollbar{width:4px}
.panel::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}

.panel-hdr{position:sticky;top:0;background:var(--bg-panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);padding:14px 18px;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel-title{font-size:17px;font-weight:700;color:var(--accent);letter-spacing:-.01em;font-family:var(--font-display)}
.panel-hdr-actions{display:flex;align-items:center;gap:4px}
.panel-action-btn{width:30px;height:30px;border:none;border-radius:8px;background:transparent;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:var(--ease);font-family:inherit}
.panel-action-btn:hover{background:var(--bg-card);color:var(--tx)}

.panel-body{padding:18px 20px 40px}

/* ═══ WELCOME HEADER ═══ */
.welcome-hdr{text-align:center;padding:8px 0 16px;animation:fadeIn .4s ease both}
.welcome-hdr .logo-mark{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 10px;box-shadow:0 4px 12px rgba(229,62,62,0.3)}
.welcome-hdr h2{font-size:20px;font-weight:700;color:var(--accent);letter-spacing:-.01em;margin-bottom:4px;font-family:var(--font-display)}
.welcome-hdr p{font-size:14px;color:var(--tx2);line-height:1.65;max-width:300px;margin:0 auto}

/* ═══ CRISIS BANNER ═══ */
.crisis-banner{background:var(--crisis-bg);border:1.5px solid rgba(220,38,38,0.15);border-radius:var(--r);padding:11px 14px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px;animation:fadeIn .3s ease both}
.crisis-banner .ci{font-size:18px;flex-shrink:0;margin-top:0}
.crisis-banner .ct{font-size:13.5px;color:var(--tx2);line-height:1.6}
.crisis-banner .ct strong{color:var(--crisis);font-weight:700}
.crisis-banner a{color:var(--crisis);text-decoration:none;font-weight:700;border-bottom:1.5px solid rgba(220,38,38,0.3);transition:var(--ease)}
.crisis-banner a:hover{border-bottom-color:var(--crisis)}

/* ═══ INFO BANNER ═══ */
.info-banner{background:var(--info-bg);border:1.5px solid rgba(37,99,235,0.12);border-radius:var(--r);padding:11px 14px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px;animation:fadeIn .3s ease both}
.info-banner .ci{font-size:16px;flex-shrink:0;margin-top:1px}
.info-banner .ct{font-size:13px;color:var(--tx2);line-height:1.6}
.info-banner a{color:var(--info);text-decoration:none;font-weight:600}

/* ═══ STAGE SELECTOR ═══ */
.stage-label{font-size:14px;font-weight:600;color:var(--tx2);margin-bottom:12px;text-align:center;font-family:var(--font-display)}
.stage-sel{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.stage-card{background:var(--bg-card);border:1.5px solid var(--bd);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:all var(--ease);display:flex;align-items:center;gap:12px;font-family:inherit;text-align:left;width:100%;color:var(--tx);animation:fadeIn .35s ease both}
.stage-card:active{transform:scale(0.98)}
.stage-card:nth-child(1){animation-delay:.05s}
.stage-card:nth-child(2){animation-delay:.1s}
.stage-card:nth-child(3){animation-delay:.15s}
.stage-card:hover{background:var(--bg-card-hover);border-color:var(--bd-active);transform:translateY(-1px);box-shadow:var(--shadow)}
.stage-card.active{border-color:var(--accent);background:rgba(229,62,62,0.08)}
.stage-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.stage-card:nth-child(1) .stage-icon{background:rgba(229,62,62,0.1)}
.stage-card:nth-child(2) .stage-icon{background:rgba(229,62,62,0.1)}
.stage-card:nth-child(3) .stage-icon{background:rgba(104,211,145,0.1)}
.stage-info{flex:1}
.stage-name{font-size:15px;font-weight:700;color:var(--accent);font-family:var(--font-display)}
.stage-desc{font-size:12.5px;color:var(--tx2);margin-top:3px;line-height:1.5}
.stage-arrow{color:var(--tx3);font-size:16px;transition:var(--ease)}
.stage-card:hover .stage-arrow{color:var(--accent);transform:translateX(2px)}

/* ═══ RESOURCE SECTIONS ═══ */
.res-section{margin-bottom:10px;animation:fadeIn .3s ease both}
.res-section:nth-child(2){animation-delay:.05s}
.res-section:nth-child(3){animation-delay:.1s}
.res-section:nth-child(4){animation-delay:.15s}
.res-section:nth-child(5){animation-delay:.2s}
.res-section:nth-child(6){animation-delay:.25s}
.res-section:nth-child(7){animation-delay:.3s}

.sec-toggle{width:100%;background:var(--bg-card);border:1.5px solid var(--bd);border-radius:var(--r);padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;color:var(--tx);font-family:var(--font-display);font-size:14px;font-weight:600;transition:var(--ease);text-align:left}
.sec-toggle:hover{background:var(--bg-card-hover);border-color:var(--bd-active)}
.sec-toggle.open{border-radius:var(--r) var(--r) 0 0;border-bottom-color:transparent;background:rgba(229,62,62,0.08)}
.sec-toggle .si{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:var(--accent-glow)}
.sec-toggle .chev{margin-left:auto;font-size:11px;color:var(--tx3);transition:transform var(--ease)}
.sec-toggle.open .chev{transform:rotate(180deg);color:var(--accent)}
.sec-toggle .badge{background:var(--accent-glow);color:var(--accent);font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;margin-left:4px}

.sec-content{background:var(--bg-card);border:1.5px solid var(--bd);border-top:none;border-radius:0 0 var(--r) var(--r);padding:10px;display:none}
.sec-content.open{display:block}

/* ═══ RESOURCE CARDS ═══ */
.rcard{background:var(--bg-panel);border:1.5px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:8px;transition:var(--ease)}
.rcard:last-child{margin-bottom:0}
.rcard:hover{border-color:var(--bd-active);box-shadow:0 2px 12px rgba(46,125,91,0.08)}

.rcard .rh{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.rcard .rn{font-size:14.5px;font-weight:700;color:var(--accent);line-height:1.35;font-family:var(--font-display)}
.rcard .rtag{font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:5px;text-transform:uppercase;letter-spacing:.4px;flex-shrink:0;margin-top:2px}
.tag-free{background:rgba(22,163,74,0.1);color:var(--success)}
.tag-call{background:rgba(229,62,62,0.1);color:var(--accent)}
.tag-online{background:rgba(139,92,246,0.1);color:#A78BFA}
.tag-location{background:rgba(217,119,6,0.1);color:#F6AD55}

.rcard .rd{font-size:13px;color:var(--tx2);margin-top:6px;line-height:1.65}
.rcard .ra{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.rbtn{font-family:var(--font-body);font-size:12px;font-weight:600;padding:7px 12px;border-radius:7px;border:1.5px solid var(--bd);background:transparent;color:var(--tx2);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;transition:var(--ease)}
.rbtn:hover{background:var(--bg-card);color:var(--tx);border-color:var(--bd-active)}
.rbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.rbtn.primary:hover{background:var(--accent-dark)}
.rbtn.green{background:var(--success);border-color:var(--success);color:#fff}
.rbtn.green:hover{background:#15803D}
.rbtn.directions{background:var(--accent-warm);border-color:var(--accent-warm);color:#fff}
.rbtn.directions:hover{background:#B45309}
.rcard .raddr{font-size:12px;color:var(--tx3);margin-top:5px;display:flex;align-items:center;gap:5px}
.rcard .raddr .pin{font-size:12px}
.dir-result{font-size:11px;color:var(--accent);font-weight:600;margin-top:4px;padding:6px 10px;background:rgba(229,62,62,0.08);border-radius:var(--rs);display:none;align-items:center;gap:6px;animation:fadeIn .25s ease}
.dir-result.show{display:flex}
.dir-result .dir-time{font-weight:700}
.dir-result .dir-dist{color:var(--tx2);font-weight:500}

/* ═══ FEEDBACK & SHARE ROW ═══ */
.rcard-actions{display:flex;gap:4px;margin-top:10px;padding-top:8px;border-top:1px solid var(--bd);align-items:center;justify-content:space-between;flex-wrap:wrap}
.rfb{display:flex;gap:3px;align-items:center}
.rfb-label{font-size:10px;color:var(--tx3);margin-right:2px;font-weight:500}
.rfb button{padding:5px 9px;font-size:12px;border:1.5px solid var(--bd);border-radius:6px;background:var(--bg-panel);cursor:pointer;color:var(--tx3);transition:var(--ease);font-family:inherit;min-width:36px}
.rfb button.y:hover,.rfb button.y.act{border-color:var(--success);color:var(--success);background:rgba(22,163,74,0.05)}
.rfb button.n:hover,.rfb button.n.act{border-color:var(--crisis);color:var(--crisis);background:rgba(220,38,38,0.04)}

/* Share button */
.share-btn{padding:5px 10px;font-size:11px;border:1.5px solid var(--bd);border-radius:6px;background:var(--bg-panel);cursor:pointer;color:var(--tx3);transition:var(--ease);font-family:inherit;display:inline-flex;align-items:center;gap:4px;font-weight:500}
.share-btn:hover{border-color:var(--info);color:var(--info);background:rgba(144,205,244,0.05)}
.share-btn.copied{border-color:var(--success);color:var(--success);background:rgba(22,163,74,0.05)}

/* ═══ BACK BUTTON ═══ */
.back-btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-body);font-size:13.5px;font-weight:600;color:var(--tx3);background:none;border:none;cursor:pointer;padding:0;margin-bottom:14px;transition:var(--ease)}
.back-btn:hover{color:var(--accent);transform:translateX(-2px)}

.priority-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);margin-bottom:12px;padding-left:2px;font-family:var(--font-display)}

/* ═══ ABOUT SECTION ═══ */
.about-section{animation:fadeIn .3s ease both}
.about-section h3{font-size:16px;font-weight:700;color:var(--accent);margin-bottom:8px;font-family:var(--font-display)}
.about-section p{font-size:13.5px;color:var(--tx2);line-height:1.65;margin-bottom:12px}
.about-section .stat-row{display:flex;gap:8px;margin:14px 0}
.about-section .stat{flex:1;background:rgba(229,62,62,0.08);border-radius:var(--r);padding:12px;text-align:center}
.about-section .stat .num{font-size:22px;font-weight:700;color:var(--accent)}
.about-section .stat .label{font-size:10px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.about-section .updated{font-size:11px;color:var(--tx3);font-style:italic;padding-top:8px;border-top:1px solid var(--bd);margin-top:12px}

/* ═══ COPYRIGHT FOOTER ═══ */
.site-footer{font-size:10px;color:var(--tx3);text-align:center;padding:16px 12px 8px;border-top:1px solid var(--bd);margin-top:20px;line-height:1.6}
.site-footer a{color:var(--tx3);text-decoration:none;border-bottom:1px dotted var(--tx3)}
.site-footer a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.site-footer .license-badge{display:inline-block;background:rgba(229,62,62,0.1);color:var(--accent);font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.3px;margin-left:4px}

/* ═══ DEMO / LANDING PAGE ═══ */
.demo-page{margin-left:var(--bar-w);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px;transition:margin-left var(--ease)}
.demo-page.shifted{margin-left:calc(var(--bar-w) + var(--panel-w))}
.demo-content{text-align:center;max-width:460px;animation:fadeIn .5s ease both}

// ═══ TRACKING ═══
var API_URL='https://script.google.com/macros/s/AKfycbzi3HBVY-wOStn2WPJhYQWjR55fTsOTORnKcRv6sG9gOTqdFMdwEgQoeJWo3J7-qADM/exec';
var session='rc_'+Date.now();

// ═══ DEV DEVICE TAG ═══
// Visit once per device: ?dev=sam-laptop, ?dev=sam-phone, etc.
// Events with a dev_tag are auto-excluded from dashboard metrics.
var urlParams=new URLSearchParams(window.location.search);
var devParam=urlParams.get('dev');
if(devParam)localStorage.setItem('rc-dev-tag',devParam);
var devTag=localStorage.getItem('rc-dev-tag')||'';

var surveyState={stage:null,needs:[],sits:[],insurance:null,county:null};

function track(event,resource,resource_url,action_type){
  if(!API_URL)return;
  var p={event:event,resource:resource||'',resource_url:resource_url||'',action_type:action_type||'',session:session,stage:surveyState.stage||'',needs:surveyState.needs||[],county:surveyState.county||'',dev_tag:devTag};
  try{navigator.sendBeacon?navigator.sendBeacon(API_URL,JSON.stringify(p)):fetch(API_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(p)})}catch(e){}
}

function plausible(eventName,props){
  if(window.plausible){window.plausible(eventName,{props:props||{}})}
}

function toast(m,t){var e=document.getElementById('toast');e.textContent=m;e.className='toast show'+(t?' '+t:'');setTimeout(function(){e.className='toast'},2500)}

function shareResource(name,phone,url){
  var shareUrl=url||'https://recovery-connect.netlify.app/';
  var shareText=name+(phone?' — '+phone:'');
  if(navigator.share){
    navigator.share({title:name,text:shareText+'\nFound on RecoveryConnect',url:shareUrl}).then(function(){
      track('share',name,shareUrl,'native_share');
      plausible('Share',{resource:name,method:'native'});
    }).catch(function(){});
    return;
  }
  var copyText=shareText+'\n'+shareUrl+'\n— Found on RecoveryConnect (recovery-connect.netlify.app)';
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(copyText).then(function(){
      toast('Copied! Paste in a text or message.','ok');
      track('share',name,shareUrl,'clipboard');
      plausible('Share',{resource:name,method:'clipboard'});
    }).catch(function(){
      fallbackCopy(copyText,name,shareUrl);
    });
  }else{
    fallbackCopy(copyText,name,shareUrl);
  }
}

function fallbackCopy(text,name,url){
  var ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('Copied! Paste in a text or message.','ok');track('share',name,url,'clipboard')}
  catch(e){toast('Couldn\'t copy — try long-pressing the link instead')}
  document.body.removeChild(ta);
}

function card(r){
  var ph=r.ph?r.ph.replace(/[^0-9+]/g,''):'';
  var h='<div class="rcard"><div class="rh"><span class="rn">'+r.n+'</span>';
  if(r.tg)h+='<span class="rtag '+tagCls[r.tg]+'">'+tagLbl[r.tg]+'</span>';
  h+='</div><div class="rd">'+r.d+'</div>';
  if(r.addr)h+='<div class="raddr"><span class="pin">📍</span>'+r.addr+'</div>';
  h+='<div class="ra">';
  if(r.ph)h+='<a href="tel:'+ph+'" class="rbtn green" data-trk="click" data-rn="'+esc(r.n)+'" data-ru="'+r.ph+'" data-at="phone">📞 '+r.ph+'</a>';
  if(r.u)h+='<a href="'+r.u+'" target="_blank" rel="noopener" class="rbtn primary" data-trk="click" data-rn="'+esc(r.n)+'" data-ru="'+r.u+'" data-at="web">🔗 Website</a>';
  if(r.addr)h+='<button class="rbtn directions" data-addr="'+esc(r.addr)+'" data-rn="'+esc(r.n)+'" aria-label="Get directions to '+esc(r.n)+'">🧭 Directions</button>';
  h+='</div>';
  if(r.addr)h+='<div class="dir-result" id="dir_'+esc(r.n).replace(/[^a-zA-Z0-9]/g,'_')+'"></div>';
  h+='<div class="rcard-actions">';
  h+='<span class="rfb"><span class="rfb-label">Helpful?</span><button class="y" data-rn="'+esc(r.n)+'" title="Still accurate">👍</button><button class="n" data-rn="'+esc(r.n)+'" title="Needs updating">👎</button></span>';
  h+='<button class="share-btn" data-sn="'+esc(r.n)+'" data-sph="'+(r.ph||'')+'" data-su="'+(r.u||'')+'" title="Share this resource">📤 Share</button>';
  h+='</div>';
  h+='</div>';
  return h;
}

function renderStage(stageId){
  var s=STAGES.find(function(x){return x.id===stageId});
  if(!s)return'';
  var h='<button class="back-btn" data-back="home">← Back to stages</button>';
  h+='<div class="crisis-banner"><span class="ci">🆘</span><div class="ct"><strong>In crisis?</strong> Call <a href="tel:988">988</a> anytime.</div></div>';
  h+='<p class="priority-label">✦ Priority for '+s.name+'</p>';
  var first=true;
  s.pri.forEach(function(k){
    var cat=R[k];if(!cat)return;
    var label=s.labels[k]||cat.title;
    var all=cat.sections?Object.values(cat.sections).reduce(function(a,b){return a.concat(b)},[]):(cat.resources||[]);
    var openClass=first?' open':'';
    h+='<div class="res-section"><button class="sec-toggle'+openClass+'" data-toggle aria-expanded="'+(first?'true':'false')+'"><span class="si">'+(iconMap[k]||'📌')+'</span>'+label+'<span class="badge">'+all.length+'</span><span class="chev">▼</span></button><div class="sec-content'+openClass+'">';
    all.forEach(function(r){h+=card(r)});
    h+='</div></div>';
    first=false;
  });
  h+=footerHTML();
  return h;
}

var curPanel=null,panelOpen=false;

function showPanel(id){
  var panel=document.querySelector('.panel');
  var body=document.getElementById('pBody');
  var title=document.getElementById('pTitle');
  var demo=document.getElementById('demo');

  document.querySelectorAll('.sb-btn').forEach(function(b){b.classList.remove('active')});
  var ab=document.querySelector('.sb-btn[data-panel="'+id+'"]');
  if(ab)ab.classList.add('active');

  var content='',tt='RecoveryConnect';

  if(id==='crisis'){content=renderCrisis();tt='🆘 Need Help Now';track('panel_view','crisis');plausible('Panel View',{panel:'crisis'})}
  else if(id==='home'){content=renderHome();tt='🌿 Find Resources';track('panel_view','home');plausible('Panel View',{panel:'home'})}
  else if(id==='about'){content=renderAbout();tt='ℹ️ About';track('panel_view','about');plausible('Panel View',{panel:'about'})}
  else if(id.indexOf('stage_')===0){
    var sid=id.replace('stage_','');
    content=renderStage(sid);
    var st=STAGES.find(function(x){return x.id===sid});
    tt=st?st.icon+' '+st.name:'Resources';
    surveyState.stage=sid;
    track('panel_view','stage_'+sid);
    plausible('Stage Selected',{stage:sid});
  }
  else if(R[id]){content=renderCategory(id);tt=R[id].title;track('panel_view',id);plausible('Panel View',{panel:id})}

  body.innerHTML=content;
  title.textContent=tt;
  panel.classList.add('open');
  if(demo)demo.classList.add('shifted');
  
  panelOpen=true;curPanel=id;
  body.scrollTop=0;

  wireEvents(body);
}
window.showPanel=showPanel;

function closePanel(){
  document.querySelector('.panel').classList.remove('open');
  var demo=document.getElementById('demo');
  if(demo)demo.classList.remove('shifted');
  document.querySelectorAll('.sb-btn').forEach(function(b){b.classList.remove('active')});
  panelOpen=false;curPanel=null;
}

function wireEvents(root){
  root.querySelectorAll('[data-toggle]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var c=this.nextElementSibling;
      this.classList.toggle('open');
      c.classList.toggle('open');
      this.setAttribute('aria-expanded',c.classList.contains('open'));
    });
  });
  root.querySelectorAll('[data-stage]').forEach(function(btn){
    btn.addEventListener('click',function(){showPanel('stage_'+this.dataset.stage)});
  });
  root.querySelectorAll('[data-back]').forEach(function(btn){
    btn.addEventListener('click',function(){showPanel(this.dataset.back)});
  });
  root.querySelectorAll('[data-trk="click"]').forEach(function(a){
    a.addEventListener('click',function(){
      track('click',this.dataset.rn,this.dataset.ru,this.dataset.at);
      plausible('Resource Click',{resource:this.dataset.rn,type:this.dataset.at});
    });
  });
  root.querySelectorAll('.rfb button').forEach(function(b){
    b.addEventListener('click',function(){
      this.closest('.rfb').querySelectorAll('button').forEach(function(x){x.classList.remove('act')});
      this.classList.add('act');
      var up=this.classList.contains('y');
      track(up?'thumbs_up':'thumbs_down',this.dataset.rn,'','feedback');
      plausible('Feedback',{resource:this.dataset.rn,type:up?'thumbs_up':'thumbs_down'});
      toast(up?'Thanks for confirming!':'Thanks — we\'ll look into it','ok');
    });
  });
  root.querySelectorAll('.share-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      shareResource(this.dataset.sn,this.dataset.sph,this.dataset.su);
      var b=this;
      b.classList.add('copied');
      b.innerHTML='✓ Copied';
      setTimeout(function(){b.classList.remove('copied');b.innerHTML='📤 Share'},2000);
    });
  });
  root.querySelectorAll('.rbtn.directions').forEach(function(btn){
    btn.addEventListener('click',function(){
      var addr=this.dataset.addr;
      var rn=this.dataset.rn;
      var resultId='dir_'+rn.replace(/[^a-zA-Z0-9]/g,'_');
      var resultEl=document.getElementById(resultId);
      var dirBtn=this;
      dirBtn.textContent='📍 Locating...';
      dirBtn.disabled=true;
      if(!navigator.geolocation){
        window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(addr)+'&travelmode=driving','_blank');
        dirBtn.textContent='🧭 Directions';
        dirBtn.disabled=false;
        return;
      }
      navigator.geolocation.getCurrentPosition(function(pos){
        var lat=pos.coords.latitude;
        var lng=pos.coords.longitude;
        var origin=lat+','+lng;
        var mapsUrl='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(origin)+'&destination='+encodeURIComponent(addr)+'&travelmode=driving';
        if(resultEl){
          resultEl.innerHTML='🚗 <a href="'+mapsUrl+'" target="_blank" rel="noopener" style="color:var(--accent);font-weight:700;text-decoration:none;border-bottom:1px solid var(--accent)">Open in Google Maps</a> <span class="dir-dist">for turn-by-turn directions from your location</span>';
          resultEl.classList.add('show');
        }
        window.open(mapsUrl,'_blank');
        dirBtn.textContent='🧭 Directions';
        dirBtn.disabled=false;
        track('directions',rn,addr,'directions');
        plausible('Directions',{resource:rn});
      },function(err){
        window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(addr)+'&travelmode=driving','_blank');
        dirBtn.textContent='🧭 Directions';
        dirBtn.disabled=false;
        if(resultEl){
          resultEl.innerHTML='📍 <span class="dir-dist">Location access denied. Google Maps will ask for your location.</span>';
          resultEl.classList.add('show');
        }
      },{enableHighAccuracy:false,timeout:8000,maximumAge:300000});
    });
  });
}

// ═══ INIT ═══
document.querySelectorAll('.sb-btn[data-panel]').forEach(function(btn){
  btn.addEventListener('click',function(){
    var id=this.dataset.panel;
    if(panelOpen&&curPanel===id)closePanel();
    else showPanel(id);
  });
});
document.getElementById('pClose').addEventListener('click',closePanel);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&panelOpen)closePanel()});

// ═══ THEME TOGGLE ═══
var themeBtn=document.getElementById('themeToggle');
var savedTheme=localStorage.getItem('rc-theme')||'dark';
document.documentElement.setAttribute('data-theme',savedTheme);
themeBtn.childNodes[0].textContent=savedTheme==='dark'?'☀️':'🌙';
themeBtn.setAttribute('aria-label',savedTheme==='dark'?'Switch to light mode':'Switch to dark mode');
themeBtn.addEventListener('click',function(){
  var cur=document.documentElement.getAttribute('data-theme')||'dark';
  var next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('rc-theme',next);
  themeBtn.childNodes[0].textContent=next==='dark'?'☀️':'🌙';
  themeBtn.setAttribute('aria-label',next==='dark'?'Switch to light mode':'Switch to dark mode');
  document.querySelector('meta[name="theme-color"]').setAttribute('content',next==='dark'?'#0D2818':'#F5F0EB');
});

if(window.innerWidth<=640){
  showPanel('home');
}
})();
</script>
